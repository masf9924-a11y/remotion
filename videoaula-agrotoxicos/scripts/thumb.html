<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"/>
<style>
  html,body{margin:0;padding:0}
  .card{width:1280px;height:720px;position:relative;overflow:hidden;
    background:radial-gradient(ellipse at 30% 25%,#12224a 0%,#070d1a 72%);
    font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#EEF2FF}
  .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(140,160,220,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(140,160,220,.06) 1px,transparent 1px);background-size:60px 60px}
  .blob{position:absolute;right:-120px;top:-120px;width:720px;height:720px;border-radius:50%;
    background:radial-gradient(circle at 50% 50%,rgba(61,220,151,.18),transparent 62%)}
  .blob2{position:absolute;left:-160px;bottom:-200px;width:620px;height:620px;border-radius:50%;
    background:radial-gradient(circle at 50% 50%,rgba(255,92,122,.16),transparent 62%)}
  .kick{position:absolute;left:80px;top:96px;font-size:26px;font-weight:700;letter-spacing:7px;color:#5AC8FA;text-transform:uppercase}
  h1{position:absolute;left:78px;top:150px;margin:0;font-size:116px;line-height:.98;font-weight:800;letter-spacing:-3px}
  .accent{color:#3DDC97}
  .rule{position:absolute;left:84px;top:430px;width:280px;height:9px;border-radius:5px;background:#3DDC97}
  .sub{position:absolute;left:84px;top:470px;font-size:34px;color:#AAB6D6;font-weight:500}
  .pills{position:absolute;left:84px;top:560px;display:flex;gap:16px}
  .pill{padding:12px 26px;border-radius:999px;border:2px solid rgba(160,180,230,.4);font-size:24px;font-weight:600;color:#EEF2FF}
  .pill.on{background:#3DDC97;color:#07131f;border-color:#3DDC97}
  .mol{position:absolute;right:120px;top:210px;opacity:.95}
  .tagtop{position:absolute;right:80px;top:96px;font-size:22px;font-weight:700;color:#FFB703;letter-spacing:2px}
  .foot{position:absolute;right:84px;bottom:70px;font-size:24px;color:#7a8aa6;text-align:right}
</style></head>
<body>
<div class="card">
  <div class="grid"></div><div class="blob"></div><div class="blob2"></div>
  <div class="kick">Toxicologia · revisão para a prova</div>
  <div class="tagtop">★ MOTION GRAPHICS</div>
  <h1>Agrotóxicos<br/><span class="accent">organoclorados</span></h1>
  <div class="rule"></div>
  <div class="sub">Do agente tóxico ao caso ambiental · 7 módulos · ~19 min</div>
  <div class="pills">
    <div class="pill on">Toxicocinética</div>
    <div class="pill on">Mecanismo Na⁺/GABA</div>
    <div class="pill">Intoxicação</div>
    <div class="pill">Ambiente</div>
  </div>
  <svg class="mol" width="360" height="360" viewBox="0 0 24 24" fill="none">
    <g stroke="#3DDC97" stroke-width="1.1" stroke-linecap="round">
      <circle cx="12" cy="12" r="3"/><circle cx="5" cy="5" r="2"/><circle cx="19" cy="5" r="2"/>
      <circle cx="5" cy="19" r="2"/><circle cx="19" cy="19" r="2"/>
      <path d="M6.5 8L10 10.5M17.5 8L14 10.5M6.5 16L10 13.5M17.5 16L14 13.5"/>
    </g>
  </svg>
  <div class="foot">Professor × Estudante · desafios estilo prova</div>
</div>
</body></html>
